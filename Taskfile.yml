# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

env:
  PAS_DIST: ../.dist
  PAS_FPC: 'E:\lazarus\fpc\3.2.2\bin\x86_64-win64\fpc.exe'
  PAS_LAZBUILD: 'E:\lazarus\lazbuild.exe'
  PAS_LAZARUS_CONFIG: '{{.LOCALAPPDATA}}\lazarus'

tasks:
  default:
    cmds:
      - task: build
  build:
    cmds:
      - task: build:doom-launcher
      - task: build:gmod-description-generator
      - task: build:hammer-launcher
      - task: build:rcalc
  build:doom-launcher:
    aliases: ["build:doom", "doom"]
    dir: doom-launcher
    cmds:
      - '"$PAS_LAZBUILD" --pcp="$PAS_LAZARUS_CONFIG" --build-mode=Default doom_launcher.lpi'
      - 'mkdir "$PAS_DIST" 2> /dev/null'
      - 'mv doom-launcher.exe "$PAS_DIST/doom-launcher.exe"'
  build:gmod-description-generator:
    aliases: ["build:gdg", "build:gmod", "gmod"]
    dir: gmod-description-generator
    cmds:
      - '"$PAS_LAZBUILD" --pcp="$PAS_LAZARUS_CONFIG" --build-mode=Default gmod_description_generator.lpi'
      - 'mkdir "$PAS_DIST" 2> /dev/null'
      - 'mv gmod_description_generator.exe "$PAS_DIST/GModDescriptionGenerator.exe"'
  build:hammer-launcher:
    aliases: ["build:hammer", "hammer"]
    dir: hammer-launcher
    cmds:
      - '"$PAS_LAZBUILD" --pcp="$PAS_LAZARUS_CONFIG" --build-mode=Default hammer_launcher.lpi'
      - 'mkdir "$PAS_DIST" 2> /dev/null'
      - 'mv hammer_launcher.exe "$PAS_DIST/HammerLauncher.exe"'
  build:rcalc:
    aliases: ["rcalc"]
    dir: rcalc
    cmds:
      - '"$PAS_LAZBUILD" --pcp="$PAS_LAZARUS_CONFIG" --build-mode=Default rcalc.lpi'
      - 'mkdir "$PAS_DIST" 2> /dev/null'
      - 'mv rcalc.exe "$PAS_DIST/rcalc.exe"'
