HintAdditionalExtensions=JS 또는 JSON으로 처리할 추가 확장자를 쉼표로 구분해 입력합니다.
HintAllowDuplicates=같은 파일을 목록에 여러 번 추가할 수 있습니다.
HintAllowLossy=품질이 낮아질 수 있지만 더 작은 파일을 만들 수 있습니다.
HintAllowMultipleInstances=FileOptimizer를 여러 개 실행할 수 있습니다.
HintAlwaysOnTop=메인 창을 다른 창보다 앞에 표시합니다.
HintBeepWhenDone=최적화가 끝나면 알림음을 재생합니다.
HintClearWhenComplete=최적화가 끝나면 파일 목록을 비웁니다.
HintCopyMetadata=제거될 수 있는 파일 메타데이터를 유지합니다.
HintCustomDPI=사용자 지정 PDF 프로필에서 사용할 이미지 해상도를 설정합니다.
HintDebug=문제 분석을 위해 임시 작업 파일을 보관합니다.
HintDisable=기타 파일 형식의 처리를 건너뜁니다.
HintDisablePETrim=EXE 호환성을 위해 PETrim을 사용하지 않습니다. 파일이 더 커질 수 있습니다.
HintDisablePluginMask=플러그인 명령줄에 포함된 문자열을 쉼표로 구분해 입력합니다. 대소문자를 구별하지 않습니다. 예: oxipng.exe,pingo.exe. 정규식과 와일드카드는 지원하지 않습니다.
HintDisableSleep=최적화 중 컴퓨터가 절전 상태로 들어가지 않게 합니다.
HintDoNotCreateBackups=원본 파일 옆에 .BAK 백업을 만들지 않습니다.
HintDoNotUseRecycleBin=원본 파일을 휴지통에 복사하지 않습니다.
HintEnableCache=캐시에 이미 최적화된 것으로 기록된 파일을 건너뜁니다.
HintEnableJSMin=파일 크기를 줄이기 위해 JSMin을 실행합니다. 편집이 어려워질 수 있습니다.
HintEnableLeanify=파일 크기를 줄이기 위해 Leanify를 실행합니다. 편집이 어려워질 수 있습니다.
HintEnableTidy=파일 크기를 줄이기 위해 Tidy를 실행합니다. 편집이 어려워질 수 있습니다.
HintEnableUPX=UPX로 실행 파일을 압축합니다. 실행할 때 압축이 풀립니다.
HintExcludeMask=전체 경로에 포함된 문자열을 쉼표로 구분해 입력합니다. 하나라도 포함되면 제외합니다. 대소문자를 구별하지 않으며 정규식과 와일드카드는 지원하지 않습니다. 예: \\cache\\,.tmp
HintFilenameFormat=목록의 파일 이름 표시 방식을 선택합니다. 부분 경로 형식은 현재 전체 경로로 표시됩니다.
HintIncludeMask=전체 경로에 포함된 문자열을 쉼표로 구분해 입력합니다. 하나라도 포함된 파일만 처리합니다. 대소문자를 구별하지 않으며 정규식과 와일드카드는 지원하지 않습니다. 예: .png,images
HintKeepAttributes=원본 파일의 속성과 시간을 유지합니다.
HintLanguage=화면에 사용할 언어를 선택합니다.
HintLeanifyIterations=Leanify 반복 횟수를 지정합니다. -1은 최적화 수준을 따릅니다.
HintLevel=최적화 수준을 속도 우선부터 압축률 우선까지 설정합니다.
HintLogLevel=0은 로그를 쓰지 않습니다. 현재 1~3 수준의 항목은 없으며 4는 실행한 플러그인 명령과 종료 코드를 실행 파일 옆 FileOptimizer.log에 기록합니다. 로그 창은 없습니다.
HintParallelCount=동시에 처리할 최대 파일 수입니다.
HintParallelEnabled=여러 파일을 동시에 처리합니다.
HintPersistentGrid=다음 실행 시에도 파일 목록을 유지합니다.
HintPNGWolfIterations=PNGWolf 반복 횟수를 지정합니다. -1은 최적화 수준을 따릅니다.
HintProcessPriority=프로세스 우선순위를 낮은 자원 사용부터 높은 성능까지 설정합니다.
HintProfile=PDF 압축을 작은 크기부터 높은 품질까지 선택합니다.
HintRecurse=압축 파일 내부의 파일도 재귀적으로 최적화합니다.
HintShutdownWhenDone=최적화가 끝나면 컴퓨터를 종료합니다.
HintSkipLayered=호환성을 위해 레이어가 있는 PDF를 건너뜁니다.
HintStartupDelay=명령행으로 전달된 파일을 처리하기 전 대기 시간입니다(밀리초).
HintStripSilence=WAV 오디오 시작과 끝의 무음 구간을 제거합니다.
HintTempDirectory=시스템 임시 폴더 대신 이 폴더에 임시 파일을 저장합니다.
HintTemplate=안전한 압축부터 강한 압축까지 템플릿을 선택합니다.
